<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAINT — Attack Chain Reconstruction</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --panel2: #161f2b; --line: #23303f;
    --text: #e6edf3; --muted: #7d8b9a; --accent: #ff4d5e; --accent2: #ffb84d;
    --ok: #3fd68a; --warn: #ffcf4d;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
  header { padding: 18px 26px; border-bottom: 1px solid var(--line); display:flex; align-items:center; gap:18px; }
  header h1 { font-size: 18px; margin:0; letter-spacing:0.5px; }
  header .sub { color:var(--muted); font-size:13px; }
  .stats { display:flex; gap:14px; margin-left:auto; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 14px; text-align:center; min-width:90px; }
  .stat .n { font-size:20px; font-weight:700; }
  .stat .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  main { display:grid; grid-template-columns: 360px 1fr; height: calc(100vh - 68px); }
  #chainList { border-right:1px solid var(--line); overflow-y:auto; padding:14px; }
  .chain-card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; cursor:pointer; transition: 0.15s; }
  .chain-card:hover { border-color:#3a4a5c; }
  .chain-card.active { border-color:var(--accent); background: linear-gradient(180deg, rgba(255,77,94,0.08), transparent); }
  .chain-card .rank { color:var(--muted); font-size:11px; }
  .chain-card .score { float:right; font-weight:700; color:var(--accent2); }
  .chain-card .path { font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
  #detail { padding: 22px 30px; overflow-y:auto; }
  #detail h2 { margin-top:0; font-size:16px; }
  .step { display:flex; gap:16px; align-items:flex-start; margin-bottom:2px; }
  .step .rail { display:flex; flex-direction:column; align-items:center; width:26px; }
  .step .dot { width:12px; height:12px; border-radius:50%; background:var(--accent2); margin-top:6px; flex:none; }
  .step .bar { width:2px; flex:1; background:var(--line); min-height:34px; }
  .step:last-child .bar { display:none; }
  .step-body { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:10px; flex:1; }
  .step-body .top-row { display:flex; align-items:center; gap:10px; }
  .badge { font-size:10.5px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; }
  .badge.ev { background:#1b2836; color:#9fd0ff; border-color:#294256; }
  .susp { margin-left:auto; font-size:12px; color:var(--muted); }
  .susp b { color:var(--accent2); }
  .flow { font-size:14.5px; margin-top:6px; }
  .flow .ent { padding:1px 6px; border-radius:5px; background:#1c2530; font-size:13px; }
  .flow .ent.user { color:#9fd0ff; } .flow .ent.machine { color:#c6f08a; }
  .flow .ent.service { color:#ffb0e0; } .flow .ent.account { color:#ffcf7a; }
  .detail-line { font-size:12px; color:var(--muted); margin-top:6px; }
  .empty { color:var(--muted); padding:40px; text-align:center; }
  select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  .legend { font-size:11px; color:var(--muted); margin-top:16px; }
  .legend span { margin-right:14px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>SAINT · Attack Chain Reconstruction</h1>
    <div class="sub">Graph-based correlation across users, machines, services & accounts</div>
  </div>
  <select id="seedSelect">
    <option value="42">Scenario A</option>
    <option value="7">Scenario B</option>
    <option value="123">Scenario C</option>
    <option value="999">Scenario D (2 attackers)</option>
  </select>
  <div class="stats">
    <div class="stat"><div class="n" id="statTotal">–</div><div class="l">Events</div></div>
    <div class="stat"><div class="n" id="statFlagged">–</div><div class="l">Flagged</div></div>
    <div class="stat"><div class="n" id="statChains">–</div><div class="l">Chains</div></div>
  </div>
</header>
<main>
  <div id="chainList"><div class="empty">Loading…</div></div>
  <div id="detail"><div class="empty">Select a chain on the left to see the reconstructed attack path.</div></div>
</main>
<script>
const seedSelect = document.getElementById('seedSelect');
let currentChains = [];

async function load() {
  const seed = seedSelect.value;
  const attacks = seed === '999' ? 2 : 1;
  const [summary, chains] = await Promise.all([
    fetch(`/api/summary?seed=${seed}&attacks=${attacks}`).then(r => r.json()),
    fetch(`/api/chains?seed=${seed}&attacks=${attacks}`).then(r => r.json()),
  ]);
  document.getElementById('statTotal').textContent = summary.total_events;
  document.getElementById('statFlagged').textContent = summary.flagged_events;
  document.getElementById('statChains').textContent = summary.chains_found;
  currentChains = chains;
  renderList();
  document.getElementById('detail').innerHTML = '<div class="empty">Select a chain on the left to see the reconstructed attack path.</div>';
}

function shortPath(chain) {
  return chain.steps.map(s => `${s.actor} → ${s.target}`).join('  ·  ');
}

function renderList() {
  const el = document.getElementById('chainList');
  if (!currentChains.length) { el.innerHTML = '<div class="empty">No chains above threshold.</div>'; return; }
  el.innerHTML = currentChains.map((c, i) => `
    <div class="chain-card" data-i="${i}">
      <span class="rank">RANK ${i+1}</span>
      <span class="score">${c.score.toFixed(1)}</span>
      <div class="path">${shortPath(c)}</div>
    </div>
  `).join('');
  [...el.querySelectorAll('.chain-card')].forEach(card => {
    card.addEventListener('click', () => {
      [...el.querySelectorAll('.chain-card')].forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      renderDetail(currentChains[parseInt(card.dataset.i)]);
    });
  });
}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function detailLine(step) {
  const det = step.detail || {};
  const bits = [];
  if (det.ip) bits.push(`ip ${det.ip}`);
  if (det.file) bits.push(`file "${det.file}"${det.size_mb ? ` (${det.size_mb} MB)` : ''}`);
  if (det.change) bits.push(`change: ${det.change}${det.ticket ? ` [${det.ticket}]` : ' — no ticket'}`);
  if (det.note) bits.push(det.note);
  return bits.join('  ·  ');
}

function renderDetail(chain) {
  const el = document.getElementById('detail');
  el.innerHTML = `
    <h2>Reconstructed path <span style="color:var(--muted); font-weight:400;">— composite score ${chain.score.toFixed(1)}, ${chain.length} steps</span></h2>
    ${chain.steps.map(s => `
      <div class="step">
        <div class="rail"><div class="dot"></div><div class="bar"></div></div>
        <div class="step-body">
          <div class="top-row">
            <span class="badge ev">${s.event_type}</span>
            <span class="badge">${fmtTime(s.ts)}</span>
            <span class="susp">suspicion <b>${s.suspicion.toFixed(2)}</b></span>
          </div>
          <div class="flow">
            <span class="ent ${s.actor_type}">${s.actor}</span> → <span class="ent ${s.target_type}">${s.target}</span>
          </div>
          ${detailLine(s) ? `<div class="detail-line">${detailLine(s)}</div>` : ''}
        </div>
      </div>
    `).join('')}
    <div class="legend">
      <span><span class="ent user">■</span> user</span>
      <span><span class="ent machine">■</span> machine</span>
      <span><span class="ent service">■</span> service</span>
      <span><span class="ent account">■</span> account</span>
    </div>
  `;
}

seedSelect.addEventListener('change', load);
load();
</script>
</body>
</html>
